[package]
name = "ojo-uia"
version = "0.1.0"
edition = "2021"

# Enumera los controles REALES de la ventana activa con sus rectangulos
# exactos, via UI Automation. No adivina: los lee del sistema.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = "thin"


