[package]
name = "ojo-captura"
version = "0.1.0"
edition = "2021"

# Captura de pantalla de un solo disparo, cronometrada por etapas.
#
# Es la primera linea del presupuesto de latencia del proyecto, y existe como
# binario propio para poder medirla aislada antes de que haya ningun modelo.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Codificador JPEG dedicado: mas rapido que el de `image` y sin arrastrar
# decodificadores de una docena de formatos que aqui no se usan.
jpeg-encoder = "0.6"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = "thin"
