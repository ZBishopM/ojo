[package]
name = "ojo-overlay"
version = "0.1.0"
edition = "2021"

# La capa que se dibuja encima de todo: cursor del agente, anillo, trazos,
# bocadillo, subtitulos y pildora de estado.
[dependencies]
# Rasterizador 2D con antialias, en Rust puro. GDI no antialiasa lineas y
# GDI+ obliga a mucho unsafe verboso para lo mismo.
tiny-skia = "0.11"
# Solo hace falta convertir glifos a mapas de cobertura; no queremos un motor
# de disposicion de texto entero.
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
